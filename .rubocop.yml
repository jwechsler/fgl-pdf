AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

Metrics/ClassLength:
  Max: 400
Metrics/ModuleLength:
  Max: 300
Metrics/MethodLength:
  Max: 40
Metrics/AbcSize:
  Max: 45
Metrics/CyclomaticComplexity:
  Max: 20
Metrics/PerceivedComplexity:
  Max: 20
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'
Metrics/ParameterLists:
  Max: 8
  CountKeywordArgs: false
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Max: 120
Naming/MethodParameterName:
  AllowedNames: [x, y, u, v, w, h, dx, dy, ax, ay, k, id, io]
# Drawables deliberately use :length/:size members (dots along the advance, em size).
Lint/StructNewOverride:
  Exclude:
    - 'lib/fgl_pdf/ticket.rb'
